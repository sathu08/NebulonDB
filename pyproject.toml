[project]
name = "nebulondb"
version = "1.0.0"
description = "NebulonDB - Hybrid Vector, Graph and Traditional Database"
requires-python = ">=3.10,<3.14"

dependencies = [
    # === Web framework & server ===
    "fastapi[standard]>=0.110,<1.0",
    "gunicorn>=21.2,<22.0",
    "uvicorn[standard]>=0.29,<0.31",

    # === Vector / ML stack ===
    "numpy>=1.24,<2.0",
    "polars>=0.20,<1.0",
    "rank-bm25>=0.2.2,<1.0",
    "bitsandbytes>=0.49.2,<0.50",
    "accelerate>=0.29,<0.31",
    "chroma-hnswlib>=0.7.6,<0.8",

    # === Security ===
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=3.2,<4.1",
    "cryptography>=42.0,<44.0",
    "keyrings.alt>=5.0,<6.0",

    # === Config & utils ===
    "configobj>=5.0.8,<6.0",
    "pyfiglet>=1.0,<2.0",
    "colorama>=0.4.6,<1.0",
    "platformdirs>=4.2,<5.0",

    # === System / Monitoring ===
    "psutil>=5.9,<6.0",
]

[project.scripts]
nebulondb = "nebulondb:main"

[tool.setuptools]
py-modules = ["nebulondb"]

[tool.setuptools.packages.find]
include = ["ndb_host*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
