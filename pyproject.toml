[project]
name = "nebulondb"
version = "1.0.0"
description = "NebulonDB - Hybrid Vector, Graph and Traditional Database"
requires-python = ">=3.10,<3.14"

dependencies = [
    # === Web framework & server ===
    "fastapi[standard]>=0.110,<1.0",
    "gunicorn>=21.2,<22.0",
    "uvicorn[standard]>=0.29,<0.31",

    # === Vector / core data stack ===
    "numpy>=1.24,<2.0",
    "polars>=0.20,<1.0",
    "chroma-hnswlib>=0.7.6,<0.8",
    "pydantic>=2.0,<3.0",

    # === Security ===
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=3.2,<4.1",
    "cryptography>=42.0,<44.0",
    "keyrings.alt>=5.0,<6.0",

    # === Config & utils ===
    "configobj>=5.0.8,<6.0",
    "pyfiglet>=1.0,<2.0",
    "colorama>=0.4.6,<1.0",
    "platformdirs>=4.2,<5.0",

    # === System / Monitoring ===
    "psutil>=5.9,<6.0",
]

# Optional heavy ML stack for semantic embedding features.
# Plain `uv sync` installs only the slim core above (~300MB).
# `uv sync --extra ml` adds torch/sentence-transformers for vectors.
[project.optional-dependencies]
ml = [
    "torch>=2.2,<3.0",
    "sentence-transformers>=2.7,<5.0",
    "accelerate>=0.29,<0.31",
    "bitsandbytes>=0.49.2,<0.50",
]

dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.5,<1.0",
]

# Pull CPU-only torch so the ~3GB nvidia CUDA bindings are never installed
# by default. GPU users can override with `uv sync --extra ml --resolution
# highest --index-strategy unsafe-best-match` and a CUDA wheel index.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
nebulondb = "nebulondb:main"

[tool.setuptools]
py-modules = ["nebulondb"]

[tool.setuptools.packages.find]
include = ["ndb_host*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "B", "SIM", "UP"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"ndb_host/api/routes/*.py" = ["E501"]
