<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - NebulonDB</title>
  <link rel="stylesheet" href="/assets/css/style.css?v=9">
</head>
<body class="dash-body">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="sidebar-brand" id="brandExpand" title="NebulonDB">
        <div class="brand-logo">N</div>
        <div class="brand-text">
          <div class="brand-name">NebulonDB</div>
          <div class="brand-sub">Nova &amp; Mesh database console</div>
        </div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm sidebar-toggle-btn" id="sidebarIconToggle" title="Toggle sidebar" aria-label="Toggle sidebar">«</button>
    </div>

    <div class="sidebar-search" style="display:flex; gap:8px; align-items:center;">
      <form autocomplete="off" onsubmit="return false;" style="flex:1; min-width:0;">
        <input id="corpusSearch" class="input" type="text" placeholder="Search corpora..." name="corpus_search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore="true" aria-label="Search corpora" style="width:100%;">
      </form>
      <button type="button" class="btn btn-ghost btn-sm" id="corpusRefreshBtn" title="Refresh corpora from server" aria-label="Refresh corpora" style="flex-shrink:0;">⟳</button>
    </div>

    <div class="sidebar-list-head">
      <span class="small muted">Corpora</span>
    </div>

    <div class="sidebar-list" id="corpusList"></div>

    <div class="sidebar-head sidebar-foot" style="border-top:1px solid var(--border);">
      <button class="btn btn-primary" id="newCorpusBtn" style="width:100%;">+ New corpus</button>
    </div>
    <div class="sidebar-drag" id="sidebarDrag" title="Drag to resize sidebar"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="topbar-title" id="topbarTitle">Overview</div>
      <div class="topbar-right">
        <div class="user-chip" id="userChip" role="button" tabindex="0" title="Account">
          <div class="user-avatar" id="userAvatar" aria-hidden="true">U</div>
          <div class="user-info">
            <span class="user-name" id="userName">—</span>
            <span class="user-role" id="userRole">—</span>
          </div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm" id="settingsBtn" title="Settings">⚙️ <span>Settings</span></button>
        <button type="button" class="btn btn-ghost btn-sm" id="logoutBtn">Sign out</button>
      </div>
    </header>

    <main class="content" id="content">
      <div class="empty-state" id="emptyState">
        <div class="icon">🗂️</div>
        <h2>Select a corpus to explore</h2>
        <p>Choose a corpus from the sidebar to view its segments and data.</p>
      </div>

      <div id="corpusView" style="display:none;">
        <div class="flex-between section">
          <div>
            <h2 id="corpusTitle" style="font-size:20px;"></h2>
            <span id="corpusBadge"></span>
            <span class="muted small" id="corpusMeta"></span>
          </div>
          <div class="flex" id="corpusActions"></div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <span class="panel-title">Segments <span class="muted small" id="segmentCount"></span></span>
            <div class="flex" style="gap:8px; flex-wrap:wrap;">
              <button class="btn btn-ghost btn-sm" id="loadSegmentBtn" style="display:none;" disabled>Load segment</button>
              <input id="segmentSearch" class="input" type="text" placeholder="Search segments…" title="Filter segments by name" style="max-width:170px;">
              <input id="segmentDate" class="input" type="date" title="Filter segments by created date" style="max-width:150px;">
            </div>
          </div>
          <div class="table-wrap" id="segmentTableWrap">
            <table>
              <thead>
                <tr>
                  <th>Segment</th>
                  <th>Records</th>
                  <th>Created</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="segmentTableBody">
                <tr><td colspan="4" class="muted" id="segmentEmpty">Loading segments...</td></tr>
              </tbody>
            </table>
          </div>
        </div>

        <div id="segmentView" style="display:none;">
          <div class="flex-between section" style="margin-top:8px;">
            <h3 style="font-size:16px;">Segment: <span id="segmentName" style="color:var(--accent);"></span></h3>
            <span class="muted small" id="segmentStatsNote"></span>
          </div>

          <div class="stats-grid" id="statsGrid"></div>

          <div class="panel">
            <div class="panel-head">
              <span class="panel-title">Data preview</span>
              <label id="vectorsToggleWrap" class="muted small" style="display:none; gap:6px; align-items:center; cursor:pointer;" title="Show embedding vectors (first 6 dims) in Metadata. Orbit only.">
                <input type="checkbox" id="showVectors"> vectors
              </label>
            </div>
            <div class="panel-body">
              <div class="flex" style="gap:8px; align-items:center; margin-bottom:10px;">
                <label class="muted small" for="dataLimit" title="Number of records to fetch from the server">Limit</label>
                <input id="dataLimit" class="input" type="number" min="1" max="1000" step="1" value="10" style="max-width:90px; flex-shrink:0;" title="Number of records to fetch (1-1000)">
                <button class="btn btn-primary btn-sm" id="getDataBtn" style="flex-shrink:0;">Get records</button>
              </div>
              <div id="dataMessage" class="muted small"></div>
              <div class="table-wrap mt-16" id="dataTableWrap" style="display:none;">
                <table>
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Text</th>
                      <th>Metadata</th>
                    </tr>
                  </thead>
                  <tbody id="dataTableBody"></tbody>
                </table>
              </div>
              <div class="flex" id="dataPagination" style="display:none; justify-content:flex-end; align-items:center; gap:8px; margin-top:10px;">
                <button class="btn btn-ghost btn-sm" id="dataPrevBtn">‹ Prev</button>
                <span class="muted small" id="dataPageInfo"></span>
                <button class="btn btn-ghost btn-sm" id="dataNextBtn">Next ›</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <div id="modalOverlay" class="modal-overlay">
    <div class="modal">
      <div class="modal-head">
        <span class="modal-title" id="modalTitle">New corpus</span>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <script src="/assets/js/api.js?v=9"></script>
  <script src="/assets/js/dashboard.js?v=9"></script>
</body>
</html>
