# =====================================================================
# nebulondb.cfg — settings for NebulonDB (the storage engine).
# Read by: NebulonDB server at startup (default serves 0.0.0.0:6969).
# How the three configs fit together:
#   1. nebulondb.cfg  (this file) — DB storage + server port 6969.
#   2. NebulonMD/nebulonmd.cfg [backend] — points Mind at this DB
#      (nebulondb_api_host/port must match [server] below).
#   3. NebulonAK/nebulonak.cfg [nebulonmind] base_url — points AK at Mind
#      (Mind's 9696, never this file's 6969).
# Start order: NebulonDB first, then Mind, then AK.
# Sections below: [paths] install dir | [environment] master key |
# [llm] embedding models | [segments]/[bloom]/[vector]/[hnsw]/[rank]
# storage tuning (defaults are fine — change only for large data) |
# [logging] | [server] host/port the DB listens on.
# =====================================================================

[paths]
nebulondb_home = /home/sathya/Codebase/NebulonDB

[environment]
nebulondb_master_key = DffNxOB38pqn-zQPxOQS9fCr5hCRn4sCIZDvzzJ2nvQ=
nebulondb_keyring_enabled = False
nebulondb_keyring_service = nebulondb-auth-service

[llm]
nebulondb_embedding_model = sentence-transformers/all-MiniLM-L6-v2
nebulondb_cross_encoder_model = cross-encoder/ms-marco-MiniLM-L-6-v2
nebulondb_model_cache_dir = /home/sathya/.cache/NebulonDB
nebulondb_embedding_batch_size = 16
nebulondb_cross_encoder_batch_size = 8
nebulondb_embedding_model_device = cpu
nebulondb_cross_encoder_model_device = cpu
nebulondb_warm_models = true
nebulondb_default_mode = false

[segments]
wal_auto_flush = true
wal_fsync_interval = 65536
# WAL durability: process (fsync on interval/flush), batch (fsync before
# every acknowledged request), per_ack (fsync before every acknowledged
# record; insert_many/delete_many fsync once per batch).
durability_mode = process
compress_segments = true
bloom_filter_enabled = true
max_open_segments = 50
compaction_interval = 60
max_segments_before_compact = 10
flush_interval = 5
flush_record_threshold = 10000

[bloom]
enabled = true
bits_per_key = 10
hash_count = 4

[vector]
dimension = 384
space = cosine
top_matches = 3
min_score = 0.50
save_every_n = 100
compaction_threshold = 0.4

[hnsw]
m = 32
ef_construction = 200
ef_search = 64

[rank]
rank_topk = 20
weight_vector = 0.55
weight_bm25 = 0.20
weight_metadata = 0.10
weight_importance = 0.10
weight_freshness = 0.05

[logging]
date = 7
auto_delete = true

[server]
app_name = NebulonDB
host = 0.0.0.0
port = 6969
workers = 1
timeout = 120
keep_alive = 5
graceful_timeout = 10
access_logfile = -
error_logfile = -
log_level = info
nebulondb_clear_cache = true

# ---------------------------------------------------------------------
# Power-loss validation (manual/scheduled WSL crash harness).
# Disabled by default. Requires root, loop devices and device-mapper.
# Do not enable on a host serving live traffic: the harness changes
# vm.dirty_* sysctls and creates its own devices/filesystem.
# ---------------------------------------------------------------------
[powerloss]
enabled = false
interval_seconds = 86400
modes = process,batch,per_ack
workloads = insert,bulk,mixed
segment = _main
keep_runs = 7
no_sysctl = false
poll_seconds = 60
state_file = .powerloss_state.json
lock_file = .powerloss.lock

[powerloss_harness]
run_root = /var/tmp/ndb_powerloss
run_dir_format = run_%Y%m%d_%H%M%S
snapshot_chunk_size = 8
sysctls = dirty_writeback_centisecs=0,dirty_expire_centisecs=60000,dirty_background_ratio=95,dirty_ratio=95
default_trials = 20
default_ops = 300
default_setup_count = 40
default_delay = 0.005
default_process_fsync_interval = 8192
default_min_delay = 0.02
default_max_delay = 1.2
default_ready_timeout = 30.0
default_seed = 20261026
default_image_mb = 256
default_cow_mb = 512
cmd_timeout = 60
umount_timeout = 20
cleanup_timeout = 20
dm_remove_attempts = 4
dm_remove_timeout = 20
loop_timeout = 20
fsck_timeout = 90
fsck_repair_timeout = 120
mount_timeout = 30
recovery_timeout = 120
kill_wait_timeout = 15
ready_poll_interval = 0.01
retry_delay = 0.1
dm_retry_delay = 0.15

[powerloss_worker]
default_seed = 1
default_ops = 300
default_setup_count = 40
default_delay = 0.002
default_wal_fsync_interval = 65536
bulk_insert_min = 5
bulk_insert_max = 12
mixed_bulk_min = 4
mixed_bulk_max = 10
delete_min = 1
delete_max = 8
insert_roll = 0.40
bulk_roll = 0.60
update_roll = 0.80

